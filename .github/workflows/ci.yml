name: CI

on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same ref supersedes an in-flight run (incl. its deploy):
# the newer run deploys the newer commit, so the end state is always correct.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast gate: lint + typecheck + backend unit tests. Deploy waits on THIS ──
  # only (not e2e), so the path to live is ~2 min. Deps are cached across runs.
  fast-checks:
    name: Fast checks (lint · typecheck · unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Run the REAL build (tsc -b && vite build) — the exact command the prod
      # Dockerfile runs. `bun run check` (tsc --noEmit, root tsconfig) does NOT
      # catch what `tsc -b` (project refs, tsconfig.app.json) does, so a green
      # check could still fail the deploy build. Gate on the real thing.
      - name: Build frontend
        run: bun run build
      - name: Lint (frontend)
        run: bun run lint
      # The backend suite shares ONE on-disk SQLite file across bun test's
      # per-file workers, so a few suites flake on CI timing — ps-bot-seed vs
      # live-DB tests, disk-replay date ordering, draft fixtures — each passing
      # in isolation and locally. Real fix is per-suite tmp DBs; until then,
      # retry so a known flake doesn't gate the deploy. A genuine
      # regression is deterministic and fails all three attempts.
      - name: Backend unit tests
        run: |
          for attempt in 1 2 3; do
            echo "::group::backend tests — attempt $attempt"
            if bun run test; then echo "::endgroup::"; exit 0; fi
            echo "::endgroup::"
            echo "attempt $attempt failed — retrying known cross-worker flake"
          done
          echo "backend tests failed all 3 attempts — real failure"
          exit 1

  # ── Deploy: gated on fast-checks, master pushes only. Triggers Coolify per
  # affected app, one at a time, and verifies each is up before the next. ──────
  deploy:
    name: Deploy (gated · staggered)
    needs: fast-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so deploy.sh can diff the TRUE
                           # github.event.before..sha range. With a shallow
                           # checkout, a multi-commit push can't resolve
                           # `before`, falls back to HEAD~1, and strands apps
                           # whose paths changed in earlier commits (e.g. a
                           # ps/** change rode the bundle but ps-server was
                           # never selected).
      - name: Deploy affected apps
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_ERROR_WEBHOOK }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: bash deploy/deploy.sh

  # ── E2E: runs in parallel, does NOT gate the deploy. On master it alerts on
  # failure so a regression that ships still pings you. Chromium is cached. ────
  e2e:
    name: E2E (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Playwright Chromium (full)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - name: Run e2e tests
        run: bun run test:e2e
        env:
          CI: true
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests/e2e/.results
          retention-days: 7
      - name: Alert on e2e failure (master)
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_ERROR_WEBHOOK }}
        run: |
          [ -n "$DISCORD_WEBHOOK" ] || { echo "no webhook configured; skipping alert"; exit 0; }
          curl -sf --max-time 10 -X POST "$DISCORD_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"content\":\"[ci/e2e] e2e FAILED on master for ${GITHUB_SHA:0:12} (deploy already shipped — verify or roll back) — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" || true

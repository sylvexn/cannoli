name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # ── Job 1: Frontend lint + typecheck ─────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (frontend)
        run: bun run check

      - name: Lint (frontend)
        run: bun run lint

  # ── Job 2: Backend unit tests ─────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Known flake: tests/ps-bot-seed.test.ts races with live-DB tests when
      # run together via `bun test tests/`. Both pass in isolation. Tracked in
      # plan/todo.md — fix is to move to a tmp-DB fixture. A failure here from
      # that file alone should not be treated as a regression.
      - name: Run backend tests
        run: bun run test

  # ── Job 3: Playwright e2e ─────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests
        run: bun run test:e2e
        env:
          CI: true

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests/e2e/.results
          retention-days: 7

# Coolify-managed compose stack for the MOCK environment (mock.cannoli.live).
# Images are built on GitHub Actions and pushed to ghcr.io — Coolify only pulls.
# See .github/workflows/deploy.yml for the build pipeline.
#
# Cross-stack DNS: services join the host-wide `coolify` network as their default
# network, with explicit aliases that match the historical container names so the
# showdown stack can target `cannoli-backend-mock` (or `cannoli-backend-live`)
# without code changes.

services:
  backend:
    image: ghcr.io/sylvexn/cannoli-backend:latest
    pull_policy: always
    environment:
      CANNOLI_MODE: mock
      NODE_ENV: production
    volumes:
      - cannoli-mock-data:/app/backend/data
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      default:
        aliases:
          - cannoli-backend-mock

  frontend:
    image: ghcr.io/sylvexn/cannoli-frontend:latest
    pull_policy: always
    environment:
      BACKEND_HOST: cannoli-backend-mock
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - coolify.fqdn=https://mock.cannoli.live
    networks:
      default:
        aliases:
          - cannoli-frontend-mock

volumes:
  cannoli-mock-data:

networks:
  default:
    name: coolify
    external: true

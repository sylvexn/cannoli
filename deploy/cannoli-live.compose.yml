# Coolify-managed compose stack for the LIVE environment (cannoli.live).
# Currently NOT deployed — cannoli-maintenance owns cannoli.live until launch.
# When ready: delete cannoli-maintenance Coolify app, create one from this file.

services:
  backend:
    image: ghcr.io/sylvexn/cannoli-backend:latest
    pull_policy: always
    environment:
      CANNOLI_MODE: live
      NODE_ENV: production
      GITHUB_REPO: ${GITHUB_REPO}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      PS_SERVER_WS_URL: ${PS_SERVER_WS_URL}
      PS_HOSTNAME: ${PS_HOSTNAME}
      PS_KEY_ID: ${PS_KEY_ID}
      BOT_USERNAME: ${BOT_USERNAME}
      BOT_PASSWORD: ${BOT_PASSWORD}
      PS_RSA_PRIVATE_KEY: ${PS_RSA_PRIVATE_KEY}
    volumes:
      - cannoli-live-data:/app/backend/data
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      default:
        aliases:
          - cannoli-backend-live

  frontend:
    image: ghcr.io/sylvexn/cannoli-frontend:latest
    pull_policy: always
    environment:
      BACKEND_HOST: cannoli-backend-live
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - coolify.fqdn=https://cannoli.live
    networks:
      default:
        aliases:
          - cannoli-frontend-live

volumes:
  cannoli-live-data:

networks:
  default:
    name: coolify
    external: true

# Coolify-managed compose stack for the Pokemon Showdown sim (sim.cannoli.live).
# Images are built on GitHub Actions and pushed to ghcr.io.
#
# This stack is INTENDED to be flippable between the mock and live cannoli
# backends. To swap targets, update these env vars on the Coolify application:
#   PS_LOGIN_HOST          (used by ps-client nginx for action.php proxy)
#   PS_LOGIN_SERVER_URL    (used by ps-server for RSA-signed assertions)
# Then redeploy.
#
# Both targets are aliases on the shared `coolify` docker network:
#   mock → cannoli-backend-mock     (PS_LOGIN_SERVER_URL=http://cannoli-backend-mock:3001/api/ps/)
#   live → cannoli-backend-live     (PS_LOGIN_SERVER_URL=http://cannoli-backend-live:3001/api/ps/)

services:
  ps-server:
    image: ghcr.io/sylvexn/cannoli-ps-server:latest
    pull_policy: always
    environment:
      PS_LOGIN_SERVER_URL: ${PS_LOGIN_SERVER_URL}
      PS_KEY_ID: ${PS_KEY_ID}
      PS_RSA_PUBLIC_KEY: ${PS_RSA_PUBLIC_KEY}
    volumes:
      - ps-logs:/ps/logs
      - ps-databases:/ps/databases
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      default:
        aliases:
          - cannoli-ps-server

  ps-client:
    image: ghcr.io/sylvexn/cannoli-ps-client:latest
    pull_policy: always
    environment:
      PS_SERVER_HOST: cannoli-ps-server
      PS_LOGIN_HOST: ${PS_LOGIN_HOST}
    expose:
      - "80"
    restart: unless-stopped
    depends_on:
      - ps-server
    labels:
      - coolify.fqdn=https://sim.cannoli.live
    networks:
      default:
        aliases:
          - cannoli-ps-client

volumes:
  ps-logs:
  ps-databases:

networks:
  default:
    name: coolify
    external: true

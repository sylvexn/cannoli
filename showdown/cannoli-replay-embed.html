<!DOCTYPE html>
<!--
  Cannoli replay embed (sim.cannoli.live/replay/embed.html?match=<matchId>)

  Standalone replay player. The Cannoli site iframes this page from the
  /replays gallery so users can scrub through battles without leaving the
  app or hitting replay.pokemonshowdown.com.

  Reuses the upstream PS Battle player JS (already shipped in the
  play.pokemonshowdown.com tree at /js/, /data/, /style/), so this page
  is intentionally tiny — it just wires up the player and points it at
  the Cannoli backend's replay JSON endpoint (/replay/data/<id>.json,
  proxied to cannoli-backend:3001).

  Renders our own control bar driving the same Battle API that the
  upstream replay panel uses (pause/play/reset/seekTurn/seekBy/setMute,
  messageShownTime/messageFadeTime + scene.updateAcceleration for speed,
  switchViewpoint). Defaults to paused so the iframe doesn't blast sound
  on page load.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Replay — Cannoli</title>

<link rel="stylesheet" href="/style/font-awesome.css" />
<link rel="stylesheet" href="/style/battle.css" />
<link rel="stylesheet" href="/style/utilichart.css" />
<link rel="stylesheet" href="/style/replay.css" />

<style>
  html, body {
    margin: 0; padding: 0;
    background: #0e0e10;
    color: #ddd;
    font-family: 'Inter', Verdana, Helvetica, sans-serif;
    overflow-x: hidden;
  }
  #wrap {
    padding: 6px;
  }
  #status {
    padding: 24px;
    text-align: center;
    color: #aaa;
    font-size: 13px;
  }
  #status.error { color: #f77; }

  /* The PS battle player hard-positions `.battle` (absolute, 640×360) and
     `.battle-log` (absolute, left:640 → right) inside a positioned, fixed-
     width wrapper. We recreate that wrapper as #player (the "stage") at the
     canonical replay proportions, then scale the whole stage with a CSS
     transform (computed in fitStage()) so the battle fills the iframe rather
     than sitting as a small box on the left with the log marooned on the
     right. Native stage = 640 battle + 540 log = 1180 × 372. */
  #stage-wrap {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
  }
  #player {
    position: relative;
    flex: none;
    width: 1180px;
    height: 372px;
    transform-origin: center center;
    border-radius: 8px;
    box-shadow: 0 0 0 1px #26262e, 0 10px 34px rgba(0, 0, 0, 0.45);
  }
  /* Re-skin PS's light battle chrome so the battle + log read as one
     rounded, theme-matched panel instead of two grey boxes adrift on the
     dark surface. */
  #player .battle {
    border-color: #26262e;
    border-radius: 8px 0 0 8px;
  }
  #player .battle-log {
    border-color: #26262e;
    border-left-color: #1c1c22;
    border-radius: 0 8px 8px 0;
    height: 360px;
  }
  /* Replays have no chat input row — hide PS's add box so an empty grey
     strip can't poke out beneath the log. */
  #player .battle-log-add { display: none !important; }

  /* ─── Control bar ─── */
  /* Sticky to the top of the iframe scroll context — when the embed page
     is taller than its iframe (the common case in non-theater mode where
     the parent fixes height to ~600px), the user can scroll the battle +
     log content while the toolbar stays pinned and reachable. Without
     this, the toolbar scrolls off and the iframe looks like it has no
     controls at all. */
  #controls {
    display: none;
    position: sticky;
    top: 0;
    z-index: 5;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px;
    padding: 6px 8px;
    margin: 0 0 8px 0;
    background: #16161a;
    border: 1px solid #26262e;
    border-radius: 6px;
    font-size: 12px;
    color: #ccc;
  }
  #controls button {
    background: #1f1f25;
    border: 1px solid #2c2c34;
    color: #ddd;
    padding: 4px 7px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: inherit;
    min-width: 26px;
    justify-content: center;
  }
  #controls button:hover:not(:disabled) {
    background: #2a2a32;
    border-color: #00d9ff;
    color: #00d9ff;
  }
  #controls button:disabled { opacity: 0.4; cursor: not-allowed; }
  #controls button.active {
    background: rgba(0, 217, 255, 0.12);
    border-color: #00d9ff;
    color: #00d9ff;
  }
  #controls .group {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  #controls .sep {
    width: 1px;
    align-self: stretch;
    background: #26262e;
    margin: 2px 4px;
  }
  #controls label {
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 10px;
    margin-right: 2px;
  }
  #turn-display {
    color: #888;
    font-variant-numeric: tabular-nums;
    margin-left: auto;
    padding-right: 4px;
    font-size: 11px;
  }
  #turn-display strong { color: #00d9ff; font-weight: 600; }
</style>

<!-- PS expects window.Config to exist before battle.js loads -->
<script src="/config/config.js"></script>
</head>
<body>
<div id="wrap">
  <div id="status">Loading replay…</div>

  <div id="controls" role="toolbar" aria-label="Replay controls">
    <div class="group">
      <button data-action="play-pause" title="Play / pause (space)" aria-label="Play / pause">
        <i class="fa fa-play" id="play-icon"></i>
      </button>
      <button data-action="reset" title="Reset to turn 0" aria-label="Reset">
        <i class="fa fa-undo"></i>
      </button>
    </div>

    <div class="sep"></div>

    <div class="group">
      <button data-action="prev-turn" title="Previous turn" aria-label="Previous turn">
        <i class="fa fa-step-backward"></i>
      </button>
      <button data-action="next-turn" title="Next turn" aria-label="Next turn">
        <i class="fa fa-step-forward"></i>
      </button>
      <button data-action="goto-turn" title="Go to turn…" aria-label="Go to turn">
        <i class="fa fa-fast-forward"></i>
      </button>
    </div>

    <div class="sep"></div>

    <div class="group">
      <label>Speed</label>
      <button data-speed="hyperfast" title="Hyperfast">»»</button>
      <button data-speed="fast" title="Fast">»</button>
      <button data-speed="normal" class="active" title="Normal">1×</button>
      <button data-speed="slow" title="Slow">«</button>
      <button data-speed="reallyslow" title="Really slow">««</button>
    </div>

    <div class="sep"></div>

    <div class="group">
      <button data-action="mute" title="Mute / unmute" aria-label="Mute / unmute">
        <i class="fa fa-volume-up" id="sound-icon"></i>
      </button>
      <button data-action="switch" title="Switch sides" aria-label="Switch sides">
        <i class="fa fa-random"></i>
      </button>
    </div>

    <span id="turn-display">Turn <strong>0</strong></span>
  </div>

  <div id="stage-wrap">
    <div id="player" style="display:none;">
      <div class="battle"></div>
      <div class="battle-log"></div>
    </div>
  </div>
</div>

<!-- PS battle player stack. Order matters; mirrors index.template.php from
     replay.pokemonshowdown.com. `defer` so they execute in source order
     after the body is parsed. -->
<script defer src="/js/lib/ps-polyfill.js"></script>
<script defer src="/js/lib/jquery-2.2.4.min.js"></script>
<script defer src="/js/lib/html-sanitizer-minified.js"></script>
<script defer src="/js/battle-sound.js"></script>
<script defer src="/js/battledata.js"></script>
<script defer src="/data/pokedex-mini.js"></script>
<script defer src="/data/pokedex-mini-bw.js"></script>
<script defer src="/data/graphics.js"></script>
<script defer src="/data/pokedex.js"></script>
<script defer src="/data/moves.js"></script>
<script defer src="/data/abilities.js"></script>
<script defer src="/data/items.js"></script>
<script defer src="/data/teambuilder-tables.js"></script>
<script defer src="/js/battle-tooltips.js"></script>
<script defer src="/js/battle.js"></script>

<script defer>
(function () {
  // PS speed → fade/delay timings, lifted verbatim from
  // replay.pokemonshowdown.com/src/replay.js so behaviour matches the
  // upstream replay player exactly (no perceptible difference between
  // "Fast" here and "Fast" on the official site).
  var FADE_TABLE = { hyperfast: 40, fast: 50, normal: 300, slow: 500, reallyslow: 1000 };
  var DELAY_TABLE = { hyperfast: 1, fast: 1, normal: 1, slow: 1000, reallyslow: 3000 };

  function ready(fn) {
    if (document.readyState !== 'loading') return fn();
    document.addEventListener('DOMContentLoaded', fn);
  }

  function showError(msg) {
    var s = document.getElementById('status');
    s.className = 'error';
    s.textContent = msg;
  }

  function getMatchId() {
    var qs = new URLSearchParams(window.location.search);
    var id = qs.get('match');
    if (id) return id;
    // /replay/embed.html/<matchId> path-style fallback (some iframes lose
    // the query string on certain proxies)
    var m = window.location.pathname.match(/\/replay\/embed\.html\/(.+)$/);
    return m ? m[1] : null;
  }

  function setSpeed(battle, value) {
    battle.messageShownTime = DELAY_TABLE[value];
    battle.messageFadeTime = FADE_TABLE[value];
    if (battle.scene && typeof battle.scene.updateAcceleration === 'function') {
      battle.scene.updateAcceleration();
    }
  }

  // Scale the fixed-size stage to fill the iframe (centered) so the battle
  // is large and there's no dead space. min() of the width/height ratios
  // keeps the whole stage inside the frame both ways; the clamp stops it
  // blowing up past ~1.9× (sprite blur) or vanishing on tiny embeds. PS's
  // own autoresize only ever scales DOWN below 640px, so it can't fill a
  // wide frame — this replaces it (battle is created with autoresize:false).
  var STAGE_W = 1180, STAGE_H = 372;
  function fitStage() {
    var wrap = document.getElementById('stage-wrap');
    var stage = document.getElementById('player');
    if (!wrap || !stage || stage.style.display === 'none') return;
    var controls = document.getElementById('controls');
    var tb = controls && controls.offsetParent !== null ? controls.offsetHeight : 0;
    var availW = wrap.clientWidth - 12;
    var availH = window.innerHeight - tb - 24;
    var scale = Math.min(availW / STAGE_W, availH / STAGE_H);
    scale = Math.max(0.3, Math.min(scale, 1.9));
    stage.style.transform = 'scale(' + scale + ')';
    // A transformed element keeps its untransformed layout box. Give the
    // wrapper the full content height and center the stage in it, so the
    // battle sits centered in a fixed-height iframe (non-theater) and
    // doesn't pool at the top of a tall one (theater).
    wrap.style.height = Math.max(STAGE_H * scale, availH) + 'px';
  }
  window.addEventListener('resize', fitStage);

  // Wire control bar to a live battle instance. Subscribe to state so
  // the play/pause icon and turn counter stay in sync when the player
  // auto-pauses at log end or transitions between turns.
  function attachControls(battle) {
    var controls = document.getElementById('controls');
    var playIcon = document.getElementById('play-icon');
    var soundIcon = document.getElementById('sound-icon');
    var turnDisplay = document.querySelector('#turn-display strong');
    controls.style.display = 'flex';

    var muted = false;

    function refresh() {
      if (battle.paused) {
        playIcon.className = 'fa fa-play';
      } else {
        playIcon.className = 'fa fa-pause';
      }
      soundIcon.className = muted ? 'fa fa-volume-off' : 'fa fa-volume-up';
      var t = battle.turn != null && battle.turn >= 0 ? battle.turn : 0;
      turnDisplay.textContent = t;
    }

    controls.addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;

      var speed = btn.getAttribute('data-speed');
      if (speed) {
        setSpeed(battle, speed);
        controls.querySelectorAll('button[data-speed]').forEach(function (b) {
          b.classList.toggle('active', b === btn);
        });
        return;
      }

      var action = btn.getAttribute('data-action');
      switch (action) {
        case 'play-pause':
          if (battle.paused) battle.play(); else battle.pause();
          break;
        case 'reset':
          battle.reset();
          break;
        case 'prev-turn':
          battle.seekBy(-1);
          break;
        case 'next-turn':
          battle.skipTurn();
          break;
        case 'goto-turn': {
          var t = window.prompt('Go to turn (e/end for final):');
          if (t == null) break;
          t = String(t).trim();
          if (!t) break;
          if (t === 'e' || t === 'end' || t === 'f' || t === 'finish') {
            battle.seekTurn(Infinity);
          } else {
            var n = Number(t);
            if (isNaN(n) || n < 0) { window.alert('Invalid turn'); break; }
            battle.seekTurn(n);
          }
          break;
        }
        case 'mute':
          muted = !muted;
          battle.setMute(muted);
          break;
        case 'switch':
          battle.switchViewpoint();
          break;
      }
      refresh();
    });

    // Spacebar toggles play/pause when the iframe has focus, matching
    // the muscle memory from PS's keyboard shortcut.
    document.addEventListener('keydown', function (e) {
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault();
        if (battle.paused) battle.play(); else battle.pause();
        refresh();
      }
    });

    battle.subscribe(refresh);
    refresh();
  }

  ready(function () {
    var matchId = getMatchId();
    if (!matchId) {
      showError('Missing ?match=<id>');
      return;
    }

    // Wait until all the deferred PS scripts have parsed and Battle is
    // defined on window. `defer` resolves before DOMContentLoaded so by
    // the time this handler runs Battle should already be available; the
    // small poll is defensive against script load races on cold caches.
    var tries = 0;
    function start() {
      if (typeof window.Battle !== 'function' || typeof window.jQuery !== 'function') {
        if (++tries > 50) {
          showError('Replay player failed to load (PS battle.js missing).');
          return;
        }
        return setTimeout(start, 100);
      }

      fetch('/replay/data/' + encodeURIComponent(matchId) + '.json', {
        credentials: 'omit',
      }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      }).then(function (replay) {
        if (!replay || !replay.log) {
          showError('Replay log not available.');
          return;
        }

        document.getElementById('status').style.display = 'none';
        var $player = window.jQuery('#player').show();

        // Force animated sprites regardless of any inherited localStorage prefs.
        // Dex.prefs() reads window.Storage.prefs() first (battle-dex.ts ~line 326).
        // Setting Storage here before Battle is constructed prevents noanim/nogif/
        // bwgfx/nopastgens from leaking in from the parent page's localStorage.
        window.Storage = {
          prefs: function (prop) {
            if (prop === 'noanim' || prop === 'nogif' || prop === 'bwgfx' || prop === 'nopastgens') {
              return false;
            }
            return undefined;
          },
        };

        var battle = new window.Battle({
          id: replay.id,
          $frame: $player.find('.battle'),
          $logFrame: $player.find('.battle-log'),
          log: String(replay.log).split('\n'),
          isReplay: true,
          // Default paused: the iframe loads on /replays without user
          // intent so we don't want sound + animation auto-firing on
          // every visit. Users hit play to start.
          paused: true,
          // We size the battle ourselves via fitStage() — PS autoresize
          // would fight the stage transform (it only downscales <640px).
          autoresize: false,
        });
        // Mirrors replays-battle.tsx — surface for debugging.
        window.battle = battle;

        attachControls(battle);
        fitStage();
        // Re-fit once layout/fonts settle (sprite sheet + log content can
        // nudge the toolbar height on the first frame).
        setTimeout(fitStage, 50);
      }).catch(function (err) {
        showError('Failed to load replay: ' + (err && err.message || err));
      });
    }
    start();
  });
})();
</script>
</body>
</html>

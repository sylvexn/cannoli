# SockJS upgrades only on URIs ending in /websocket; everything else under
# /showdown/ is plain HTTP (info, xhr, xhr_streaming, eventsource…). Flip
# Connection between "upgrade" and "close" based on the request — putting
# this map here (http-context) works because conf.d/*.conf is included
# inside http {} in nginx:alpine's default nginx.conf.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index testclient.html;

    # CSP: allow iframe embedding from cannoli.live and mock
    add_header Content-Security-Policy "frame-ancestors 'self' https://cannoli.live https://mock.cannoli.live" always;

    # SockJS endpoints to the PS game server. The PS client (sockjs-1.4.0)
    # opens /showdown/info first to negotiate, then connects to
    # /showdown/<serverId>/<sessionId>/{websocket,xhr,xhr_streaming,…}.
    # The previous `location /showdown/websocket` only matched the literal
    # path and 404'd everything else, so the client's connection layer
    # never came up and auto-login could never run.
    location /showdown/ {
        resolver 127.0.0.11 valid=10s;
        set $gameserver http://${PS_SERVER_HOST}:8000;
        proxy_pass $gameserver;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # The embed page itself must never stick in a browser cache: it carries the
    # player logic, so a stale copy silently keeps running old code after a
    # deploy (this happened — a fixed embed kept 404ing for someone whose
    # browser held the previous build). `no-cache` still allows a 304, it just
    # forces revalidation every load.
    location = /replay/embed.html {
        add_header Cache-Control "no-cache";
    }

    # /replay/data/<matchId>.json proxy to Cannoli backend.
    # The cannoli-replay-embed.html page (served at /replay/embed.html) fetches
    # this same-origin, so no CORS to worry about and no cookies needed —
    # replays are public to everyone including guests.
    # The backend route returns the full PS-format replay JSON
    # (id, format, players, log, uploadtime).
    location ~ ^/replay/data/(?<matchid>.+)\.json$ {
        resolver 127.0.0.11 valid=10s;
        set $replaybackend http://${PS_LOGIN_HOST}:3001/api/matches/$matchid/replay.json;
        proxy_pass $replaybackend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /news.json proxy to Cannoli backend.
    # PS's mainmenu pseudo-PM "Latest News" calls
    # `https://<Config.routes.root>/news.json` — which resolves to this
    # origin. We surface Cannoli's site-wide announcement banner from the
    # backend so admins post once in /admin/site-settings and it appears
    # in the lobby news pane here.
    location = /news.json {
        resolver 127.0.0.11 valid=10s;
        set $newsbackend http://${PS_LOGIN_HOST}:3001/news.json;
        proxy_pass $newsbackend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Action.php proxy to Cannoli backend (login server).
    # The modern PS client (client-connection.js → PSLoginServer.rawQuery)
    # builds URLs as `/~~<server-id>/action.php` relative to the client's
    # origin — not bare `/action.php`. Match both so SSO upkeep XHRs from
    # sim.cannoli.live land on the backend instead of falling through to the
    # static try_files block (which would serve testclient.html and the PS
    # client would interpret the HTML response as a MitM and bail).
    location ~ ^(?:/~~[^/]+)?/action\.php$ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://${PS_LOGIN_HOST}:3001/api/ps/action.php;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # Sprites / battle FX / audio → official PS CDN.
    # The client resolves these against Config.routes.client (= sim.cannoli.live),
    # e.g. avatars at /sprites/trainers/<name>.png and battle Pokemon sprites at
    # /sprites/gen5/<name>.png — but `node build full` ships none of them, so every
    # one 404s and renders as a broken image. We don't want to host the multi-GB
    # sprite set, so redirect these static asset paths to play.pokemonshowdown.com
    # (which serves them publicly). 302 + same-origin request → browser follows to
    # the CDN; <img>/audio don't need CORS. This is what fixes broken trainer
    # avatars and in-battle sprites.
    location ~ ^/(sprites|fx|audio)/ {
        return 302 https://play.pokemonshowdown.com$request_uri;
    }

    # PS client-side room routes (/teambuilder, /view-matchup, /battle-*, and a
    # plain refresh mid-session) are handled by the client's own JS router and
    # are always a single path segment with no file extension. Falling those
    # back to testclient.html fixes the 404 on deep-link/refresh without
    # touching the miss behavior below: every real static asset (data files,
    # sprites, JS chunks) has an extension and/or lives under a subdirectory,
    # so it never matches this location and still 404s as intended.
    location ~ ^/[^./]+$ {
        try_files $uri $uri/ /testclient.html;
    }

    # Static files. Don't fall back to testclient.html on miss — script tags
    # in testclient.html use onerror="loadRemoteData(...)" to redirect to the
    # smogon CDN when local data files don't exist (we don't ship sprites or
    # build the pokedex-mini bundles), and onerror only fires on real load
    # errors, not on a 200 of HTML. Returning 404 lets the fallback work.
    # `index testclient.html` (above) still serves the SPA at `/`.
    location / {
        try_files $uri $uri/ =404;
    }
}

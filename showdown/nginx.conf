server {
    listen 80;
    root /usr/share/nginx/html;
    index testclient.html;

    # CSP: allow iframe embedding from cannoli.live and mock
    add_header Content-Security-Policy "frame-ancestors 'self' https://cannoli.live https://mock.cannoli.live" always;

    # WebSocket proxy to PS game server
    location /showdown/websocket {
        resolver 127.0.0.11 valid=10s;
        set $gameserver http://${PS_SERVER_HOST}:8000;
        proxy_pass $gameserver;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Action.php proxy to Cannoli backend (login server)
    location /action.php {
        resolver 127.0.0.11 valid=10s;
        set $backend http://${PS_LOGIN_HOST}:3001/api/ps/action.php;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
    }

    # Static files
    location / {
        try_files $uri $uri/ /testclient.html;
    }
}

# Link-preview crawlers (Discord, Slack, Twitter, ...) don't run the SPA, so
# shared Draft Center links are answered by the backend with OG meta + a share
# card image. Everyone else falls through to the SPA.
map $http_user_agent $link_preview_bot {
    default 0;
    ~*(discordbot|twitterbot|slackbot|slack-imgproxy|facebookexternalhit|telegrambot|whatsapp|linkedinbot|skypeuripreview|mastodon|bluesky) 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://${BACKEND_HOST}:3001;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Disk-fallback team/user assets (when R2 isn't configured at upload time
    # the backend stores files under /uploads/<dir>/<file> and serves them via
    # GET /uploads/:dir/:file). Without this proxy nginx's SPA fallback below
    # would rewrite the request to index.html and the <img> would render the
    # HTML page instead of the asset.
    location /uploads/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://${BACKEND_HOST}:3001;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/draft-center/s/([A-Za-z0-9_-]+)$ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://${BACKEND_HOST}:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        if ($link_preview_bot) {
            rewrite ^/draft-center/s/(.*)$ /api/draft-center/shared/$1/embed break;
            proxy_pass $backend;
        }
        try_files /index.html =404;
    }

    location /ws/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://${BACKEND_HOST}:3001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

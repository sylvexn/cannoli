server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://${BACKEND_HOST}:3001;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Disk-fallback team/user assets (when R2 isn't configured at upload time
    # the backend stores files under /uploads/<dir>/<file> and serves them via
    # GET /uploads/:dir/:file). Without this proxy nginx's SPA fallback below
    # would rewrite the request to index.html and the <img> would render the
    # HTML page instead of the asset.
    location /uploads/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://${BACKEND_HOST}:3001;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://${BACKEND_HOST}:3001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
